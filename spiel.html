<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreis-Tipp-Spiel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      user-select: none;
    }

    #kreis {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #c0392b);
      box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
      cursor: pointer;
      transition: transform 0.1s;
    }

    #kreis:active {
      transform: scale(0.9);
    }

    #punkte {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: white;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .plus-eins {
      position: absolute;
      color: #ffd700;
      font-size: 22px;
      font-weight: bold;
      pointer-events: none;
      animation: hochfliegen 0.8s ease-out forwards;
    }

    @keyframes hochfliegen {
      0%   { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-60px); }
    }
  </style>
</head>
<body>

  <div id="kreis"></div>

  <div id="punkte">Punkte: 0</div>

  <script>
    let punkte = 0;
    const kreis = document.getElementById('kreis');
    const punkteAnzeige = document.getElementById('punkte');

    function zufallsPosition() {
      const rand = 80;
      const x = rand + Math.random() * (window.innerWidth - 2 * rand);
      const y = rand + Math.random() * (window.innerHeight - 2 * rand);
      kreis.style.left = (x - 40) + 'px';
      kreis.style.top  = (y - 40) + 'px';
    }

    function plusEinsAnzeigen(x, y) {
      const el = document.createElement('div');
      el.className = 'plus-eins';
      el.textContent = '+1';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    kreis.addEventListener('click', (e) => {
      punkte++;
      punkteAnzeige.textContent = 'Punkte: ' + punkte;
      plusEinsAnzeigen(e.clientX - 15, e.clientY - 30);
      zufallsPosition();
    });

    zufallsPosition();
  </script>
</body>
</html>
