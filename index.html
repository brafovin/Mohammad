<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kreis-Tipp-Spiel</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d1a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', Arial, sans-serif;
      user-select: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,102,241,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,102,241,0.07) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 8s linear infinite;
      pointer-events: none;
    }

    @keyframes gridMove {
      0%   { transform: translateY(0); }
      100% { transform: translateY(50px); }
    }

    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      animation: orbPulse 4s ease-in-out infinite alternate;
    }
    .orb1 { width: 400px; height: 400px; background: #6366f1; top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: #ec4899; bottom: -80px; right: -80px; animation-delay: 2s; }
    .orb3 { width: 200px; height: 200px; background: #06b6d4; top: 40%; left: 40%; animation-delay: 1s; }

    @keyframes orbPulse {
      from { transform: scale(1);   opacity: 0.10; }
      to   { transform: scale(1.2); opacity: 0.20; }
    }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 30px;
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      z-index: 100;
    }

    #titel {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      color: rgba(255,255,255,0.4);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #punkte-box { display: flex; align-items: center; gap: 12px; }

    #punkte-label {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #punkte {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(99,102,241,0.8), 0 0 40px rgba(99,102,241,0.4);
      min-width: 60px;
      text-align: right;
      transition: transform 0.1s;
    }

    #punkte.bump { transform: scale(1.3); }

    #best-box { display: flex; align-items: center; gap: 8px; }

    #best-label {
      font-size: 12px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 1px;
    }

    #best-wert {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: #fbbf24;
      text-shadow: 0 0 10px rgba(251,191,36,0.5);
    }

    #combo {
      position: fixed;
      top: 90px;
      right: 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: #f472b6;
      text-shadow: 0 0 10px rgba(244,114,182,0.7);
      opacity: 0;
      transition: opacity 0.3s;
      letter-spacing: 2px;
      z-index: 100;
    }
    #combo.sichtbar { opacity: 1; }

    #kreis {
      position: absolute;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      cursor: pointer;
    }

    #kreis-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #a78bfa, #6d28d9 60%, #4c1d95);
      box-shadow:
        0 0 0 3px rgba(167,139,250,0.4),
        0 0 30px rgba(109,40,217,0.8),
        0 0 60px rgba(109,40,217,0.4),
        inset 0 2px 6px rgba(255,255,255,0.3);
      animation: kreisFloat 3s ease-in-out infinite;
      transition: transform 0.08s;
    }

    @keyframes kreisFloat {
      0%, 100% { transform: translateY(0px) scale(1); }
      50%       { transform: translateY(-8px) scale(1.02); }
    }

    #kreis::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid rgba(167,139,250,0.3);
      animation: ringPulse 2s ease-in-out infinite;
    }

    #kreis::after {
      content: '';
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      border: 1px solid rgba(167,139,250,0.15);
      animation: ringPulse 2s ease-in-out infinite 0.5s;
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(1);   opacity: 0.5; }
      50%       { transform: scale(1.1); opacity: 0.1; }
    }

    .emoji-pop {
      position: absolute;
      font-size: 30px;
      pointer-events: none;
      animation: hochfliegen 0.9s ease-out forwards;
      z-index: 200;
    }

    @keyframes hochfliegen {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      20%  { transform: translateY(-15px) scale(1.3); }
      100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(167,139,250,0.8);
      pointer-events: none;
      animation: rippleOut 0.6s ease-out forwards;
      z-index: 150;
    }

    @keyframes rippleOut {
      0%   { width: 90px; height: 90px; opacity: 1; transform: translate(-50%,-50%) scale(1); }
      100% { width: 90px; height: 90px; opacity: 0; transform: translate(-50%,-50%) scale(3); }
    }

    .partikel {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      animation: partikelFly 0.7s ease-out forwards;
      z-index: 180;
    }

    @keyframes partikelFly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx),var(--dy)) scale(0); }
    }

    #timer-bar-wrap {
      position: fixed;
      top: 70px;
      left: 0; right: 0;
      height: 4px;
      background: rgba(255,255,255,0.05);
      z-index: 100;
    }

    #timer-bar {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #6d28d9, #f472b6);
      transform-origin: left;
      transition: none;
    }

    #timer-bar.lauft {
      transition: transform 2s linear;
      transform: scaleX(0);
    }

    #bottombar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    #bottombar span {
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #wiederholung {
      position: fixed;
      bottom: 15px;
      right: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      z-index: 200;
    }

    #wiederholung:hover {
      background: rgba(255,255,255,0.1);
      color: #fff;
    }

    #gameover {
      position: fixed;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(14px);
      z-index: 300;
      gap: 22px;
    }

    #gameover.aktiv { display: flex; }

    #gameover-grund {
      font-family: 'Orbitron', sans-serif;
      font-size: 40px;
      font-weight: 900;
      color: #ff4d4d;
      text-shadow: 0 0 30px rgba(255,77,77,0.8);
      letter-spacing: 4px;
    }

    .final-score {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      font-weight: 900;
      color: #a78bfa;
      text-shadow: 0 0 40px rgba(167,139,250,0.8);
    }

    #gameover-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #gameover button {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(109,40,217,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-top: 8px;
    }

    #gameover button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 35px rgba(109,40,217,0.8);
    }
  </style>
</head>
<body>

  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>

  <div id="hud">
    <div id="titel">Tap Circle</div>
    <div id="punkte-box">
      <span id="punkte-label">Score</span>
      <div id="punkte">0</div>
    </div>
    <div id="best-box">
      <span id="best-label">BEST</span>
      <div id="best-wert">0</div>
    </div>
  </div>

  <div id="combo"></div>

  <!-- Timer Bar -->
  <div id="timer-bar-wrap">
    <div id="timer-bar"></div>
  </div>

  <div id="kreis">
    <div id="kreis-inner"></div>
  </div>

  <div id="bottombar">
    <span>Tippe den Kreis</span>
  </div>

  <div id="wiederholung">&#x21BA; Neustart</div>

  <div id="gameover" onclick="event.stopPropagation()">
    <div id="gameover-grund">DANEBEN!</div>
    <div class="final-score" id="final-score">0</div>
    <div id="gameover-sub">Punkte erreicht</div>
    <button id="neustart-btn">&#x21BA; Nochmal versuchen</button>
  </div>

  <script>
    const STARTGROESSE = 90;
    const MINGROESSE   = 40;
    const SCHRUMPF     = 1.5;

    let punkte       = 0;
    let kreisGroesse = STARTGROESSE;
    let streak       = 0;
    let farbIndex    = 0;
    let spielLaeuft  = false;
    let comboTimer   = null;
    let zeitTimer    = null;
    let best         = parseInt(localStorage.getItem('best') || '0');
    const timerBar   = document.getElementById('timer-bar');

    const kreis        = document.getElementById('kreis');
    const kreisInner   = document.getElementById('kreis-inner');
    const punkteEl     = document.getElementById('punkte');
    const bestEl       = document.getElementById('best-wert');
    const comboEl      = document.getElementById('combo');
    const gameoverEl   = document.getElementById('gameover');
    const grundEl      = document.getElementById('gameover-grund');
    const finalScoreEl = document.getElementById('final-score');

    bestEl.textContent = best;

    const farben = [
      ['#a78bfa','#6d28d9','#4c1d95'],
      ['#f472b6','#db2777','#9d174d'],
      ['#34d399','#059669','#064e3b'],
      ['#60a5fa','#2563eb','#1e3a8a'],
      ['#fb923c','#ea580c','#7c2d12'],
    ];

    function setFarbe(idx) {
      const [h, m, d] = farben[idx];
      kreisInner.style.background = `radial-gradient(circle at 35% 30%, ${h}, ${m} 60%, ${d})`;
    }

    function kreisGroesseSetzen(g) {
      kreis.style.width  = g + 'px';
      kreis.style.height = g + 'px';
    }

    function zufallsPosition() {
      const half   = kreisGroesse / 2;
      const margin = half + 20;
      const topOff = 90;
      const botOff = 75;
      const x = margin + Math.random() * (window.innerWidth  - 2 * margin);
      const y = topOff + margin + Math.random() * (window.innerHeight - topOff - botOff - 2 * margin);
      kreis.style.left = (x - half) + 'px';
      kreis.style.top  = (y - half) + 'px';
    }

    function timerStarten() {
      clearTimeout(zeitTimer);
      timerBar.classList.remove('lauft');
      timerBar.style.transform = 'scaleX(1)';
      void timerBar.offsetWidth; // reflow
      timerBar.classList.add('lauft');
      zeitTimer = setTimeout(() => {
        if (spielLaeuft) zeigeGameOver('ZU LANGSAM! ⏱️');
      }, 2000);
    }

    function timerStoppen() {
      clearTimeout(zeitTimer);
      timerBar.classList.remove('lauft');
      timerBar.style.transform = 'scaleX(1)';
    }

    function zeigeGameOver(grund) {
      spielLaeuft = false;
      timerStoppen();
      grundEl.textContent      = grund;
      finalScoreEl.textContent = punkte;
      gameoverEl.classList.add('aktiv');
    }

    function neustart() {
      punkte       = 0;
      kreisGroesse = STARTGROESSE;
      streak       = 0;
      farbIndex    = 0;
      punkteEl.textContent = '0';
      kreisGroesseSetzen(STARTGROESSE);
      setFarbe(0);
      document.body.style.background = '#0d0d1a';
      document.querySelector('.orb1').style.background = '#6366f1';
      document.querySelector('.orb2').style.background = '#ec4899';
      gameoverEl.classList.remove('aktiv');
      zufallsPosition();
      setTimeout(() => {
        spielLaeuft = true;
        timerStarten();
      }, 300);
    }

    document.getElementById('neustart-btn').addEventListener('click', neustart);
    document.getElementById('wiederholung').addEventListener('click', neustart);

    document.addEventListener('click', (e) => {
      if (!spielLaeuft) return;
      if (!kreis.contains(e.target)) {
        zeigeGameOver('DANEBEN! 😬');
      }
    });

    kreis.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!spielLaeuft) return;

      const rect = kreis.getBoundingClientRect();
      const cx   = rect.left + rect.width  / 2;
      const cy   = rect.top  + rect.height / 2;
      const dist = Math.sqrt((e.clientX - cx) ** 2 + (e.clientY - cy) ** 2);
      if (dist > rect.width / 2) {
        zeigeGameOver('DANEBEN! 😬');
        return;
      }

      punkte++;
      streak++;

      kreisGroesse = Math.max(MINGROESSE, kreisGroesse - SCHRUMPF);
      kreisGroesseSetzen(kreisGroesse);

      punkteEl.textContent = punkte;
      punkteEl.classList.add('bump');
      setTimeout(() => punkteEl.classList.remove('bump'), 100);

      // Hintergrundfarbe je nach Score
      if (punkte >= 30) {
        document.body.style.background = '#1a1a00';
        document.querySelector('.orb1').style.background = '#ca8a04';
        document.querySelector('.orb2').style.background = '#fbbf24';
      } else if (punkte >= 20) {
        document.body.style.background = '#00101a';
        document.querySelector('.orb1').style.background = '#1d4ed8';
        document.querySelector('.orb2').style.background = '#60a5fa';
      } else if (punkte >= 10) {
        document.body.style.background = '#001a0d';
        document.querySelector('.orb1').style.background = '#15803d';
        document.querySelector('.orb2').style.background = '#4ade80';
      }

      if (punkte > best) {
        best = punkte;
        bestEl.textContent = best;
        localStorage.setItem('best', best);
      }

      emojiZeigen(e.clientX, e.clientY);
      rippleZeigen(e.clientX, e.clientY);
      partikelZeigen(e.clientX, e.clientY);

      if (streak >= 5) {
        clearTimeout(comboTimer);
        const msgs = {5:'HOT STREAK 🔥',6:'ON FIRE 🔥',7:'UNSTOPPABLE ⚡',8:'INSANE 💥',9:'GODLIKE 👑',10:'LEGENDARY 🏆'};
        comboEl.textContent = msgs[streak] || `BEAST MODE x${streak} 🐉`;
        comboEl.classList.add('sichtbar');
        comboTimer = setTimeout(() => comboEl.classList.remove('sichtbar'), 1500);
      }

      if (punkte % 5 === 0) {
        farbIndex = (farbIndex + 1) % farben.length;
        setFarbe(farbIndex);
      }

      zufallsPosition();
      timerStarten();
    });

    function emojiZeigen(x, y) {
      const el = document.createElement('div');
      el.className   = 'emoji-pop';
      el.textContent = '😂';
      el.style.left  = (x - 15) + 'px';
      el.style.top   = (y - 20) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 900);
    }

    function rippleZeigen(x, y) {
      const el = document.createElement('div');
      el.className  = 'ripple';
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 600);
    }

    function partikelZeigen(x, y) {
      const colors = ['#a78bfa','#f472b6','#60a5fa','#34d399','#fbbf24'];
      for (let i = 0; i < 10; i++) {
        const el    = document.createElement('div');
        el.className = 'partikel';
        const angle  = (i / 10) * 2 * Math.PI;
        const dist   = 40 + Math.random() * 40;
        el.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        el.style.background = colors[i % colors.length];
        el.style.left = x + 'px';
        el.style.top  = y + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 700);
      }
    }

    neustart();
  </script>
</body>
</html>
